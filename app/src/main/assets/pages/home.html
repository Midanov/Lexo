<div class="screen active" id="screen-home">
  <div class="scroll">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-top:4px;">
      <div style="display:flex;align-items:center;gap:8px;">
        <h2>Lexo</h2>
        <button onclick="openSettings()" style="background:var(--bg3);border:0.5px solid var(--border);border-radius:8px;padding:5px 7px;cursor:pointer;display:flex;align-items:center;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        </button>
      </div>
      <div class="streak-badge"><span class="streak-n" id="streak-count">0</span><span class="streak-lbl">días</span></div>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-n" style="color:var(--teal-l)" id="stat-total">0</div><div class="stat-l">Palabras</div></div>
      <div class="stat"><div class="stat-n" style="color:var(--amber-l)" id="stat-due">0</div><div class="stat-l">Pendientes</div></div>
      <div class="stat"><div class="stat-n" style="color:#F0997B" id="stat-mastered">0</div><div class="stat-l">Dominadas</div></div>
    </div>
    <div class="card">
      <h3 style="margin-bottom:10px;">Sesión de hoy</h3>
      <div class="tag-row" id="session-tags" style="margin-bottom:12px;"></div>
      <button class="btn btn-primary" id="start-btn" onclick="startStudy()">Comenzar sesión →</button>
    </div>
    <div class="card" style="margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h3>Progreso CEFR</h3>
        <span style="font-size:11px;color:var(--amber-l);font-weight:500;" id="cefr-est"></span>
      </div>
      <div id="cefr-progress-list"></div>
    </div>
    <div style="height:8px;"></div>
  </div>
</div>
