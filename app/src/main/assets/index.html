<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Lexo – Aprende inglés</title>

<!-- ── Global styles ── -->
<link rel="stylesheet" href="css/global.css">

<!-- ── Per-page styles ── -->
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/study.css">
<link rel="stylesheet" href="css/game.css">
<link rel="stylesheet" href="css/vocab.css">
<link rel="stylesheet" href="css/explore.css">
</head>
<body>

<!-- ── Loading splash (shown while pages/ fragments load) ── -->
<div id="shell-loading" style="
  position:fixed;inset:0;
  background:var(--bg);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:16px;z-index:9999;">
  <div style="font-size:36px;font-weight:800;color:var(--amber);letter-spacing:-2px;">Lexo</div>
  <div class="spinner"></div>
</div>

<!-- ── App shell: screens and modals are injected here ── -->
<div id="app"></div>

<!-- ── Bottom navigation (static — always visible) ── -->
<nav class="nav">
  <button class="nav-btn active" onclick="showScreen('home')">
    <div class="nav-icon">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </div>
    Inicio
  </button>
  <button class="nav-btn" onclick="showScreen('study')">
    <div class="nav-icon">
      <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M12 9v6M9 12h6"/></svg>
    </div>
    Tarjetas
  </button>
  <button class="nav-btn" onclick="showScreen('game')">
    <div class="nav-icon">
      <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
    </div>
    Juego
  </button>
  <button class="nav-btn" onclick="showScreen('vocab')">
    <div class="nav-icon">
      <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    </div>
    Vocab
  </button>
  <button class="nav-btn" onclick="showScreen('explore')">
    <div class="nav-icon">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    </div>
    Explorar
  </button>
</nav>

<!-- ── Scripts: utils must load first ── -->
<script src="js/utils.js"></script>
<script src="js/home.js"></script>
<script src="js/study.js"></script>
<script src="js/game.js"></script>
<script src="js/vocab.js"></script>
<script src="js/explore.js"></script>
<script src="js/add-word.js"></script>

<script>
// ══════════════════════════════════════════════════
//  PAGE LOADER
//  Fetches all pages/ fragments in parallel and
//  injects them into #app before booting the app.
// ══════════════════════════════════════════════════

// Pages to load, in DOM order.
// modals.html last so FAB + overlays sit above screens.
const PAGES = [
  'pages/home.html',
  'pages/study.html',
  'pages/game.html',
  'pages/vocab.html',
  'pages/explore.html',
  'pages/modals.html',
];

async function loadPages() {
  const app = document.getElementById('app');

  // Fetch all fragments in parallel
  const results = await Promise.all(
    PAGES.map(url =>
      fetch(url)
        .then(r => {
          if (!r.ok) throw new Error(`Failed to load ${url}: ${r.status}`);
          return r.text();
        })
    )
  );

  // Inject in order, preserving fragment root nodes
  results.forEach(html => {
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    while (tmp.firstChild) app.appendChild(tmp.firstChild);
  });
}

async function boot() {
  try {
    await loadPages();
  } catch (err) {
    console.error('Page load error:', err);
    document.getElementById('app').innerHTML =
      `<div style="color:#F0997B;padding:32px;font-size:14px;">
        Error al cargar la app: ${err.message}
      </div>`;
    document.getElementById('shell-loading').style.display = 'none';
    return;
  }

  // Wire up overlay close-on-backdrop and enter key
  ['add-overlay', 'detail-overlay', 'settings-overlay'].forEach(id => {
    document.getElementById(id).addEventListener('click', e => {
      if (e.target.id === id) e.target.classList.remove('open');
    });
  });
  document.getElementById('new-word').addEventListener('keydown', e => {
    if (e.key === 'Enter') generateCard();
  });

  // Hide the loading splash
  document.getElementById('shell-loading').style.display = 'none';

  // Boot the app
  init();
}

boot();
</script>
</body>
</html>
